<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Review · Rewind TCET</title>
  <link rel="icon" type="image/png" href="assets/rewind-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #f6f7fb; --surface: #ffffff; --surface-2: #f0f2f8;
  --text: #141a2e; --muted: #5b647d; --line: #e4e7f0;
  --accent: #4f46e5; --accent-soft: #eceafe;
  --shadow: 0 1px 3px rgba(20,26,46,.08), 0 8px 24px rgba(20,26,46,.06);
  --radius: 16px;
}
[data-theme="dark"] {
  --bg: #0c0f1a; --surface: #151a2b; --surface-2: #1c2238;
  --text: #eef1fb; --muted: #9aa3bd; --line: #273049;
  --accent: #8b84ff; --accent-soft: #211d44;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: "Inter", sans-serif; background: var(--bg); color: var(--text);
  line-height: 1.5; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: "Space Grotesk", sans-serif; }
.admin-nav {
  max-width: 1040px; margin: 0 auto; padding: 18px 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; color: inherit; }
.brand img { height: 26px; }
.admin-badge {
  font-size: .72rem; padding: 3px 8px; border-radius: 6px;
  background: var(--accent); color: #fff; font-weight: 600; text-transform: uppercase;
}
main { max-width: 1040px; margin: 0 auto; padding: 30px 20px 60px; }
.login-box {
  max-width: 380px; margin: 80px auto; padding: 32px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); text-align: center;
}
.login-box h2 { margin: 0 0 10px; }
.login-box p { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
.login-box input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--text); font: inherit; font-size: .95rem; margin-bottom: 16px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: 10px; border: none;
  font-family: inherit; font-weight: 600; font-size: .88rem; cursor: pointer;
  transition: transform .15s ease, opacity .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--accent); color: #fff; width: 100%; }
.btn-approve { background: #15803d; color: #fff; }
.btn-reject { background: #dc2626; color: #fff; }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px; text-align: center;
}
.stat-num { font-size: 2rem; font-weight: 700; font-family: "Space Grotesk"; color: var(--accent); }
.stat-label { font-size: .8rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.tab-btn {
  padding: 8px 16px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--muted); font-weight: 600; font-size: .9rem; cursor: pointer;
}
.tab-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.sub-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; margin-bottom: 18px; box-shadow: var(--shadow);
}
.sub-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.sub-title { margin: 0 0 6px; font-size: 1.25rem; }
.sub-meta { color: var(--muted); font-size: .85rem; margin: 0 0 14px; display: flex; gap: 12px; flex-wrap: wrap; }
.tag {
  display: inline-block; padding: 3px 8px; border-radius: 6px;
  font-size: .72rem; font-weight: 600; text-transform: uppercase;
}
.tag-ise { background: #d9f3e2; color: #15803d; }
.tag-mse { background: #fdecd2; color: #d97706; }
.tag-ese { background: #e0ebff; color: #2563eb; }

.ai-box {
  background: var(--surface-2); border-radius: 10px; padding: 12px 16px;
  margin: 14px 0; font-size: .84rem; border-left: 3px solid var(--accent);
}
.ai-box strong { color: var(--text); }
.ai-flag { color: #d97706; font-weight: 600; }
.ai-pass { color: #15803d; font-weight: 600; }

.sub-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 40px; background: var(--surface); border-radius: var(--radius); }
  </style>
</head>
<body>
  <header class="admin-nav">
    <a class="brand" href="/">
      <img src="assets/rewind-logo.png" alt="Rewind" />
      <span>Rewind</span>
      <span class="admin-badge">Admin Review</span>
    </a>
    <div style="display:flex;gap:10px;align-items:center;">
      <a href="/" class="btn btn-secondary" style="text-decoration:none">Back to Site</a>
      <button id="logoutBtn" class="btn btn-secondary" style="display:none">Logout</button>
    </div>
  </header>

  <main>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-box">
      <h2>Admin Sign In</h2>
      <p>Enter your admin password to review uploaded question papers.</p>
      <form id="loginForm">
        <input type="password" id="adminKey" placeholder="Admin Password" required autofocus />
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" style="display:none">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-num" id="statPending">0</div>
          <div class="stat-label">Pending Review</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statApproved" style="color:#15803d">0</div>
          <div class="stat-label">Approved & Published</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statRejected" style="color:#dc2626">0</div>
          <div class="stat-label">Rejected</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-status="pending" onclick="setTab('pending')">Pending Review</button>
        <button class="tab-btn" data-status="approved" onclick="setTab('approved')">Approved</button>
        <button class="tab-btn" data-status="rejected" onclick="setTab('rejected')">Rejected</button>
      </div>

      <div id="submissionsList">Loading submissions...</div>
    </div>
  </main>

  <script>
    var currentTab = 'pending';
    var API_KEY = sessionStorage.getItem('rewind-admin-key');

    if (API_KEY) {
      showPanel();
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var key = document.getElementById('adminKey').value.trim();
      if (!key) return;
      API_KEY = key;
      sessionStorage.setItem('rewind-admin-key', key);
      showPanel();
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
      sessionStorage.removeItem('rewind-admin-key');
      location.reload();
    });

    function showPanel() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      document.getElementById('logoutBtn').style.display = 'inline-flex';
      loadStats();
      loadSubmissions(currentTab);
    }

    function setTab(status) {
      currentTab = status;
      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.getAttribute('data-status') === status);
      });
      loadSubmissions(status);
    }

    async function loadStats() {
      try {
        var res = await fetch('/api/admin?action=stats', {
          headers: { 'X-Admin-Key': API_KEY }
        });
        if (res.status === 401) {
          alert('Invalid admin password.');
          sessionStorage.removeItem('rewind-admin-key');
          location.reload();
          return;
        }
        var data = await res.json();
        document.getElementById('statPending').textContent = data.pending || 0;
        document.getElementById('statApproved').textContent = data.approved || 0;
        document.getElementById('statRejected').textContent = data.rejected || 0;
      } catch (err) {
        console.error('Stats error:', err);
      }
    }

    async function loadSubmissions(status) {
      var container = document.getElementById('submissionsList');
      container.innerHTML = '<p class="empty">Loading ' + status + ' papers...</p>';

      try {
        var res = await fetch('/api/admin?status=' + status, {
          headers: { 'X-Admin-Key': API_KEY }
        });
        var data = await res.json();
        var subs = data.submissions || [];

        if (!subs.length) {
          container.innerHTML = '<div class="empty">No ' + status + ' papers found.</div>';
          return;
        }

        container.innerHTML = subs.map(function (s) {
          var bucketBase = 'https://bpdyqvdebwaxcyipkftt.supabase.co/storage/v1/object/public/papers/';
          var pdfUrl = bucketBase + s.file_path;

          var actions = '';
          if (status === 'pending') {
            actions = '<button class="btn btn-approve" onclick="approveSub(\'' + s.id + '\')">✅ Approve & Publish</button>' +
                      '<button class="btn btn-reject" onclick="rejectSub(\'' + s.id + '\')">❌ Reject</button>';
          }

          return '<div class="sub-card">' +
            '<div class="sub-header">' +
              '<div>' +
                '<h3 class="sub-title">' + escapeHtml(s.title) + ' · ' + escapeHtml(s.subject_name) + ' (' + escapeHtml(s.year) + ')</h3>' +
                '<div class="sub-meta">' +
                  '<span>Group ' + escapeHtml(s.group_id) + '</span>' +
                  '<span>' + escapeHtml(s.semester.toUpperCase()) + ' Sem</span>' +
                  '<span class="tag tag-' + s.exam_type.toLowerCase() + '">' + s.exam_type + '</span>' +
                  '<span>Contributed by: <strong>' + escapeHtml(s.contributor_name) + '</strong></span>' +
                  '<span>Size: ' + (s.file_size / 1024).toFixed(0) + ' KB</span>' +
                  '<span>Date: ' + new Date(s.created_at).toLocaleDateString() + '</span>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="sub-actions">' +
              '<a href="' + pdfUrl + '" target="_blank" rel="noopener" class="btn btn-secondary">👁️ View Uploaded PDF</a>' +
              actions +
            '</div>' +
          '</div>';
        }).join('');

      } catch (err) {
        container.innerHTML = '<div class="empty" style="color:#dc2626">Error loading submissions: ' + err.message + '</div>';
      }
    }

    async function approveSub(id) {
      if (!confirm('Approve this paper and publish it live on the site?')) return;
      try {
        var res = await fetch('/api/admin?action=approve', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': API_KEY
          },
          body: JSON.stringify({ id: id })
        });
        var data = await res.json();
        if (data.success) {
          alert('Paper approved and published live!');
          loadStats();
          loadSubmissions(currentTab);
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Request failed: ' + err.message);
      }
    }

    async function rejectSub(id) {
      var reason = prompt('Reason for rejection (optional):', 'Subject mismatch / poor quality');
      if (reason === null) return;
      try {
        var res = await fetch('/api/admin?action=reject', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': API_KEY
          },
          body: JSON.stringify({ id: id, reason: reason })
        });
        var data = await res.json();
        if (data.success) {
          alert('Submission rejected.');
          loadStats();
          loadSubmissions(currentTab);
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Request failed: ' + err.message);
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
  </script>
</body>
</html>
